
<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123B70">
  <title>SMART SCHOOL</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#eef3f9;
      color:#18324f
    }
    header{
      background:#123b70;
      color:white;
      padding:24px 18px;
      border-radius:0 0 24px 24px
    }
    header h1{margin:0;font-size:25px}
    header p{margin:8px 0 0;opacity:.9}
    main{max-width:560px;margin:22px auto;padding:0 16px}
    .card{
      background:white;
      border-radius:18px;
      padding:22px;
      box-shadow:0 6px 22px #17395b18
    }
    .status{
      display:inline-block;
      background:#e5f5eb;
      color:#176b38;
      padding:7px 11px;
      border-radius:20px;
      font-size:13px
    }
    h2{font-size:19px;margin:18px 0 8px}
    p{line-height:1.55}
    .note{font-size:13px;color:#60758c}
  </style>
</head>
<body>
  <header>
    <h1>SMART SCHOOL</h1>
    <p>नया ऐप — PWA परीक्षण</p>
  </header>

  <main>
    <section class="card">
      <span class="status">टेस्ट पेज सफलतापूर्वक खुला</span>
      <h2>स्वागत है</h2>
      <p>यह केवल PWA और APK बनाने की प्रक्रिया जाँचने के लिए अस्थायी पेज है।</p>
      <p class="note">अभी इसमें लॉगिन, विद्यार्थी डेटा, अटेंडेंस या Google Sheet कनेक्शन नहीं जोड़ा गया है। आपका पुराना SMART SCHOOL सुरक्षित रहेगा।</p>
    </section>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
